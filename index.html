<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сны Наяву — Визуальные Новеллы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700;900&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #020611;
            --ice-cyan: #7df9ff;
            --ice-blue: #00bfff;
            --glow-bright: #00ffff;
            --card-border: rgba(0, 240, 255, 0.6);
            --text-gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-deep);
            color: #dbeafe;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 20%, #0d2859 0%, #030a1c 60%, #01040a 100%);
        }

        /* Background Runes & Atmosphere */
        .bg-decor {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            background-image: 
                radial-gradient(2px 2px at 100px 150px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, var(--ice-cyan), rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 700px 300px, #fff, rgba(0,0,0,0));
            background-size: 400px 400px;
        }

        .rune-symbol {
            position: absolute;
            font-family: 'Cinzel Decorative', serif;
            color: rgba(0, 240, 255, 0.25);
            font-size: 60px;
            text-shadow: 0 0 20px rgba(0,240,255,0.4);
            pointer-events: none;
        }

        .app-viewport {
            position: relative;
            width: 100%;
            max-width: 1300px;
            height: 900px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
            padding: 10px;
        }

        /* Top Right Logo */
        .top-right-logo {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 80px;
            height: 80px;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--ice-cyan);
            font-family: 'Cinzel', serif;
            font-size: 10px;
            text-shadow: 0 0 10px var(--ice-cyan);
            box-shadow: 0 0 15px rgba(0,240,255,0.2);
        }

        /* Phone Screen Layout Trio */
        .devices-wrapper {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .phone-frame {
            position: absolute;
            width: 380px;
            height: 560px;
            background: rgba(3, 12, 31, 0.88);
            border: 3px solid rgba(0, 240, 255, 0.5);
            border-radius: 36px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 25px rgba(0, 240, 255, 0.2), 0 0 20px rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(16px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .phone-frame.center {
            z-index: 10;
            transform: scale(1) translateX(0);
            border-color: var(--ice-cyan);
            box-shadow: 0 0 45px rgba(0, 240, 255, 0.45), inset 0 0 30px rgba(0, 240, 255, 0.25);
        }

        .phone-frame.side-left {
            z-index: 5;
            transform: scale(0.85) translateX(-360px) rotateY(15deg);
            opacity: 0.7;
            cursor: pointer;
        }

        .phone-frame.side-right {
            z-index: 5;
            transform: scale(0.85) translateX(360px) rotateY(-15deg);
            opacity: 0.7;
            cursor: pointer;
        }

        .phone-header {
            padding: 18px 15px 12px 15px;
            text-align: center;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.15) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 1px solid rgba(0, 240, 255, 0.25);
        }

        .phone-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 19px;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 12px var(--ice-cyan);
            font-weight: 700;
        }

        .phone-body {
            padding: 16px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Ice Crystal Card */
        .ice-card {
            background: linear-gradient(160deg, rgba(10, 28, 64, 0.9) 0%, rgba(2, 9, 24, 0.95) 100%);
            border: 2px solid var(--card-border);
            border-radius: 20px;
            padding: 12px;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ice-card::before {
            content: '◆';
            position: absolute;
            top: -10px;
            color: var(--ice-cyan);
            text-shadow: 0 0 10px var(--ice-cyan);
            font-size: 14px;
        }

        .card-cover-wrapper {
            position: relative;
            width: 100%;
            height: 190px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.3);
            margin-bottom: 10px;
        }

        .card-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(0,240,255,0.5);
        }

        .card-stars {
            color: var(--text-gold);
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .card-progress-track {
            width: 100%;
            height: 7px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
            border: 1px solid rgba(0,240,255,0.2);
        }

        .card-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0077ff, var(--ice-cyan));
            box-shadow: 0 0 10px var(--ice-cyan);
        }

        .btn-ice {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25) 0%, rgba(0, 120, 255, 0.5) 100%);
            border: 1.5px solid var(--ice-cyan);
            color: #ffffff;
            padding: 8px 30px;
            border-radius: 22px;
            font-family: 'Cinzel', serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
            transition: all 0.3s ease;
        }

        .btn-ice:hover {
            box-shadow: 0 0 25px var(--glow-bright);
            transform: scale(1.05);
        }

        /* Profile Layout Elements */
        .profile-avatar-frame {
            width: 110px;
            height: 110px;
            margin: 0 auto 10px auto;
            position: relative;
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
            background: linear-gradient(135deg, var(--ice-cyan), var(--ice-blue));
            padding: 3px;
            box-shadow: 0 0 25px var(--ice-cyan);
        }

        .profile-avatar-inner {
            width: 100%; height: 100%;
            clip-path: polygon(50% 0%, 90% 20%, 100% 60%, 75% 100%, 25% 100%, 0% 60%, 10% 20%);
            background: #081630;
            overflow: hidden;
        }

        .profile-avatar-inner img { width: 100%; height: 100%; object-fit: cover; }

        .rank-title {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .rank-sub {
            font-size: 12px;
            color: var(--ice-cyan);
            text-align: center;
            margin-bottom: 10px;
        }

        /* Settings Components */
        .setting-box {
            background: rgba(8, 22, 48, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 12px;
        }

        .setting-label {
            font-size: 12px;
            color: #93c5fd;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .slider-ice {
            width: 100%;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.15);
            outline: none;
        }

        .slider-ice::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--ice-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--ice-cyan);
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* Bottom Stone Altar Navigation Pedestal */
        .bottom-altar-nav {
            position: relative;
            width: 100%;
            max-width: 900px;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            padding: 15px 30px 25px 30px;
            background: radial-gradient(ellipse at bottom, rgba(16, 42, 86, 0.95) 0%, rgba(2, 6, 18, 0.98) 80%);
            border: 2px solid rgba(0, 240, 255, 0.4);
            border-radius: 50px;
            box-shadow: 0 -10px 40px rgba(0, 240, 255, 0.2), inset 0 0 30px rgba(0, 240, 255, 0.15);
        }

        .nav-stone-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-stone-btn.active, .nav-stone-btn:hover {
            color: var(--ice-cyan);
            text-shadow: 0 0 12px var(--ice-cyan);
        }

        .nav-stone-btn .icon {
            font-size: 26px;
            filter: drop-shadow(0 0 5px rgba(0,240,255,0.3));
        }

        .nav-stone-btn .label {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .altar-center-emblem {
            position: relative;
            top: -30px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.35) 0%, rgba(3, 10, 28, 0.95) 100%);
            border: 2.5px solid var(--ice-cyan);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px var(--ice-cyan), inset 0 0 15px var(--ice-cyan);
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .altar-center-emblem:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 0 50px var(--glow-bright);
        }

        .altar-center-emblem .emblem-title {
            font-family: 'Cinzel', serif;
            font-size: 9px;
            font-weight: 900;
            color: #ffffff;
            text-align: center;
            line-height: 1.1;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="bg-decor"></div>
    <div class="rune-symbol" style="top: 10%; left: 5%;">ᚠ</div>
    <div class="rune-symbol" style="bottom: 15%; right: 6%;">ᚦ</div>

    <div class="app-viewport">

        <!-- Top Right Dreamcatcher Watermark -->
        <div class="top-right-logo">
            <span style="font-size: 18px;">☸</span>
            <span style="margin-top:2px;">СНЫ НАЯВУ</span>
        </div>

        <!-- Devices Container -->
        <div class="devices-wrapper">

            <!-- LEFT SCREEN: Settings -->
            <div class="phone-frame side-left" id="card-settings" onclick="activateTab('settings')">
                <div class="phone-header">
                    <h2>НАСТРОЙКИ</h2>
                </div>
                <div class="phone-body">
                    <div class="setting-box">
                        <div class="setting-label">
                            <span>Громкость музыки</span>
                            <span style="color:var(--ice-cyan);">60%</span>
                        </div>
                        <input type="range" class="slider-ice" value="60">
                        <div class="setting-label" style="margin-top:12px;">
                            <span>Громкость звуков</span>
                            <span style="color:var(--ice-cyan);">80%</span>
                        </div>
                        <input type="range" class="slider-ice" value="80">
                    </div>

                    <div class="setting-box">
                        <div style="font-family:'Cinzel'; font-size:12px; color:var(--ice-cyan); margin-bottom:8px;">ЯЗЫК И ИНТЕРФЕЙС</div>
                        <div style="font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                            <span>Выбор языка</span>
                            <span style="color:var(--ice-cyan);">Русский ▼</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CENTER SCREEN: Main -->
            <div class="phone-frame center" id="card-home">
                <div class="phone-header">
                    <h2>ГЛАВНАЯ</h2>
                </div>
                <div class="phone-body">
                    <div class="ice-card">
                        <div class="card-cover-wrapper">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" class="card-cover">
                        </div>
                        <div class="card-title">СЕРДЦЕ ОКЕАНА</div>
                        <div class="card-stars">★ ★ ★ ★ ☆</div>
                        <div class="card-progress-track">
                            <div class="card-progress-fill" style="width: 45%;"></div>
                        </div>
                        <button class="btn-ice">ЧИТАТЬ</button>
                    </div>
                </div>
            </div>

            <!-- RIGHT SCREEN: Profile -->
            <div class="phone-frame side-right" id="card-profile" onclick="activateTab('profile')">
                <div class="phone-header">
                    <h2>МОЙ ПРОФИЛЬ</h2>
                </div>
                <div class="phone-body">
                    <div class="profile-avatar-frame">
                        <div class="profile-avatar-inner">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80">
                        </div>
                    </div>
                    <div class="rank-title">ЗВЕЗДНЫЙ СТРАННИК</div>
                    <div class="rank-sub">Уровень 45</div>

                    <div style="background: rgba(8,22,48,0.6); padding: 10px; border-radius: 12px; border: 1px solid rgba(0,240,255,0.2);">
                        <div style="font-size:11px; display:flex; justify-content:space-between; margin-bottom:4px;">
                            <span>Пройдено историй:</span> <span style="color:#fff;">12</span>
                        </div>
                        <div style="font-size:11px; display:flex; justify-content:space-between;">
                            <span>Время в игре:</span> <span style="color:#fff;">154ч</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Mystic Stone Navigation -->
        <nav class="bottom-altar-nav">
            <div class="nav-stone-btn" id="btn-settings" onclick="activateTab('settings')">
                <div class="icon">⚙️</div>
                <div class="label">НАСТРОЙКИ</div>
            </div>

            <div class="nav-stone-btn active" id="btn-home" onclick="activateTab('home')">
                <div class="icon">🌀</div>
                <div class="label">ГЛАВНАЯ</div>
            </div>

            <div class="altar-center-emblem" onclick="activateTab('home')">
                <span style="font-size: 22px; color: var(--ice-cyan);">☸</span>
                <div class="emblem-title">СНЫ<br>НАЯВУ</div>
            </div>

            <div class="nav-stone-btn" onclick="alert('Раздел Магазин')">
                <div class="icon">🪷</div>
                <div class="label">МАГАЗИН</div>
            </div>

            <div class="nav-stone-btn" id="btn-profile" onclick="activateTab('profile')">
                <div class="icon">👑</div>
                <div class="label">ПРОФИЛЬ</div>
            </div>
        </nav>

    </div>

    <script>
        function activateTab(tab) {
            const home = document.getElementById('card-home');
            const settings = document.getElementById('card-settings');
            const profile = document.getElementById('card-profile');

            const btnHome = document.getElementById('btn-home');
            const btnSettings = document.getElementById('btn-settings');
            const btnProfile = document.getElementById('btn-profile');

            [btnHome, btnSettings, btnProfile].forEach(b => b && b.classList.remove('active'));

            if (tab === 'home') {
                home.className = 'phone-frame center';
                settings.className = 'phone-frame side-left';
                profile.className = 'phone-frame side-right';
                btnHome.classList.add('active');
            } else if (tab === 'settings') {
                settings.className = 'phone-frame center';
                home.className = 'phone-frame side-right';
                profile.className = 'phone-frame side-left';
                btnSettings.classList.add('active');
            } else if (tab === 'profile') {
                profile.className = 'phone-frame center';
                home.className = 'phone-frame side-left';
                settings.className = 'phone-frame side-right';
                btnProfile.classList.add('active');
            }
        }
    </script>
</body>
</html>
