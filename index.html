<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сны Наяву - Главная</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ГЛАВНЫЙ ЭКРАН ХАБА -->
    <div id="app-hub" class="app-container">
        
        <!-- Заголовок приложения -->
        <header class="app-header">
            <div class="decorative-branches-left"></div>
            <h1 class="main-title">СНЫ НАЯВУ</h1>
            <div class="decorative-branches-right"></div>
        </header>

        <!-- Основной прокручиваемый контент -->
        <main class="scrollable-content">
            
            <!-- СЕКЦИЯ 1: КАРУСЕЛЬ ГЛАВНЫХ ИСТОРIЙ (Крупные карточки) -->
            <section class="main-stories-carousel">
                <!-- Карточка 1: Звездная Гавань -->
                <div class="story-card-large polygon-shape" style="background-image: url('images/space_bg.jpg');">
                    <div class="card-overlay">
                        <h2 class="story-title-large">ЗВЁЗДНАЯ<br>ГАВАНЬ</h2>
                        <button class="play-circle-btn" onclick="startStory('space_harbor')">▶</button>
                    </div>
                </div>

                <!-- Карточка 2: Тени Опала -->
                <div class="story-card-large polygon-shape" style="background-image: url('images/opal_bg.jpg');">
                    <div class="card-overlay">
                        <h2 class="story-title-large">ТЕНИ<br>ОПАЛА</h2>
                        <button class="play-circle-btn" onclick="startStory('opal_shadows')">▶</button>
                    </div>
                </div>
            </section>

            <!-- Секция-разделитель -->
            <div class="section-divider">ИССЛЕДУЙ МИРЫ</div>

            <!-- СЕКЦИЯ 2: СЕТКА ДРУГИХ МИРОВ (Маленькие шестиугольные/ромбовидные плашки) -->
            <section class="worlds-grid">
                <div class="world-node polygon-mini" onclick="startStory('wind_keeper')" style="background-image: url('images/wind.jpg');">
                    <div class="node-title">ХРАНИТЕЛЬ ВЕТРА</div>
                </div>
                <div class="world-node polygon-mini" onclick="startStory('ice_heart')" style="background-image: url('images/ice.jpg');">
                    <div class="node-title">СЕРДЦЕ ЛЬДА</div>
                </div>
                <div class="world-node polygon-mini" onclick="startStory('poison_bastion')" style="background-image: url('images/poison.jpg');">
                    <div class="node-title">БАСТИОН ЯДА</div>
                </div>
            </section>

        </main>

        <!-- СЕКЦИЯ 3: НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ (ТАБ-БАР) -->
        <nav class="bottom-navigation">
            <div class="nav-item" onclick="switchTab('settings')">
                <div class="nav-icon icon-settings">⚙️</div>
                <span class="nav-label">НАСТРОЙКИ</span>
            </div>
            <div class="nav-item active" onclick="switchTab('main')">
                <div class="nav-icon icon-main">📖</div>
                <span class="nav-label">ГЛАВНАЯ</span>
            </div>
            <div class="nav-item" onclick="switchTab('profile')">
                <div class="nav-icon icon-profile">👤</div>
                <span class="nav-label">ПРОФИЛЬ</span>
            </div>
            <div class="nav-item catcher-tab" onclick="switchTab('dream-catcher')">
                <div class="nav-icon icon-catcher">🕸️</div>
                <span class="nav-label">Ловец Снов</span>
            </div>
        </nav>

    </div>

    <script src="script.js"></script>
</body>
</html>
