<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сны Наяву — Визуальные Новеллы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040817;
            --cyan-glow: #00f0ff;
            --blue-glow: #2d82ff;
            --crystal-border: rgba(0, 240, 255, 0.4);
            --panel-bg: rgba(8, 18, 41, 0.75);
            --panel-border: rgba(64, 150, 255, 0.3);
            --gold-accent: #ffd700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: #e0f2fe;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 30%, #102a56 0%, #050b1e 60%, #02040a 100%);
        }

        /* Звёздный фон */
        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #00f0ff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.6;
        }

        /* Контейнер приложения */
        .app-viewport {
            position: relative;
            width: 100%;
            max-width: 1280px;
            height: 100vh;
            max-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 1;
            padding: 20px 10px;
        }

        /* Шапка */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
        }

        .dream-catcher-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dream-icon {
            width: 42px; height: 42px;
            border-radius: 50%;
            border: 2px solid var(--cyan-glow);
            box-shadow: 0 0 15px var(--cyan-glow);
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; background: rgba(0, 240, 255, 0.1);
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-weight: 700; font-size: 22px;
            letter-spacing: 3px; color: #ffffff;
            text-shadow: 0 0 10px var(--cyan-glow);
        }

        /* 3D Карусель Экранов */
        .screens-container {
            position: relative;
            width: 100%; height: 560px;
            display: flex; justify-content: center; align-items: center;
        }

        .screen-panel {
            position: absolute;
            width: 360px; height: 520px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(12px);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            display: flex; flex-direction: column;
            opacity: 0; transform: scale(0.8) translateX(0);
            pointer-events: none;
        }

        .screen-panel.active {
            opacity: 1; transform: scale(1) translateX(0);
            z-index: 10; pointer-events: auto;
            border-color: rgba(0, 240, 255, 0.7);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.3), inset 0 0 25px rgba(0, 240, 255, 0.2);
        }

        .screen-panel.left {
            opacity: 0.65; transform: scale(0.85) translateX(-340px) rotateY(12deg);
            z-index: 5; pointer-events: auto; cursor: pointer;
        }

        .screen-panel.right {
            opacity: 0.65; transform: scale(0.85) translateX(340px) rotateY(-12deg);
            z-index: 5; pointer-events: auto; cursor: pointer;
        }

        /* Заголовки и карточки */
        .screen-header {
            padding: 16px 20px; text-align: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.1) 0%, rgba(0, 0, 0, 0) 100%);
        }

        .screen-header h2 {
            font-family: 'Cinzel', serif; font-size: 18px;
            letter-spacing: 2px; color: #e0f2fe;
            text-shadow: 0 0 8px var(--cyan-glow);
            text-transform: uppercase;
        }

        .screen-content {
            padding: 16px; overflow-y: auto; flex-grow: 1;
            display: flex; flex-direction: column; gap: 16px;
        }

        .novel-card {
            background: linear-gradient(135deg, rgba(13, 30, 65, 0.8) 0%, rgba(5, 12, 30, 0.9) 100%);
            border: 1.5px solid var(--crystal-border);
            border-radius: 16px; padding: 12px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .novel-card-featured {
            border: 2px solid var(--cyan-glow);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .novel-img-wrapper {
            width: 100%; height: 180px;
            border-radius: 12px; overflow: hidden; margin-bottom: 10px;
        }

        .novel-img { width: 100%; height: 100%; object-fit: cover; }

        .novel-title {
            font-family: 'Cinzel', serif; font-size: 16px; font-weight: 700;
            margin-bottom: 6px; color: #ffffff;
        }

        .rating-stars { color: var(--gold-accent); font-size: 12px; margin-bottom: 8px; }

        .progress-bar-container {
            width: 100%; height: 6px;
            background: rgba(255, 255, 255, 0.1); border-radius: 3px; margin-bottom: 12px;
        }

        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, var(--blue-glow), var(--cyan-glow));
            box-shadow: 0 0 8px var(--cyan-glow);
        }

        .btn-crystal {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(45, 130, 255, 0.4) 100%);
            border: 1px solid var(--cyan-glow); color: #ffffff;
            padding: 8px 24px; border-radius: 20px;
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: all 0.3s ease; text-transform: uppercase;
        }

        .btn-crystal:hover {
            box-shadow: 0 0 20px var(--cyan-glow); transform: translateY(-2px);
        }

        /* Навигационная панель */
        .bottom-nav-container {
            width: 100%; display: flex; justify-content: center;
        }

        .magic-pedestal {
            display: flex; align-items: center; gap: 15px;
            background: linear-gradient(180deg, rgba(8, 20, 48, 0.8) 0%, rgba(3, 8, 20, 0.95) 100%);
            border: 1px solid rgba(0, 240, 255, 0.3); border-radius: 40px;
            padding: 10px 25px; backdrop-filter: blur(15px);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            cursor: pointer; padding: 8px 16px; border-radius: 20px; color: #94a3b8;
            transition: all 0.3s ease;
        }

        .nav-item.active { color: var(--cyan-glow); text-shadow: 0 0 8px var(--cyan-glow); }

        .center-dreamcatcher {
            position: relative; top: -15px; width: 70px; height: 70px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.3) 0%, rgba(5, 12, 30, 0.9) 100%);
            border: 2px solid var(--cyan-glow); border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 0 25px var(--cyan-glow); cursor: pointer;
        }

        .center-dreamcatcher span {
            font-family: 'Cinzel', serif; font-size: 8px; text-align: center; color: #ffffff; font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div class="app-viewport">
        <!-- Шапка -->
        <header class="top-bar">
            <div class="dream-catcher-logo">
                <div class="dream-icon">☸</div>
                <div class="brand-title">СНЫ НАЯВУ</div>
            </div>
            <div style="font-family: 'Cinzel', serif; font-size: 14px; color: var(--cyan-glow);">
                💎 215 Осколков
            </div>
        </header>

        <!-- Карусель экранов -->
        <div class="screens-container">
            <!-- ЭКРАН НАСТРОЕК -->
            <div class="screen-panel left" id="screen-settings" onclick="switchTab('settings')">
                <div class="screen-header"><h2>Настройки</h2></div>
                <div class="screen-content">
                    <div style="background: rgba(15,23,42,0.5); padding: 12px; border-radius: 12px;">
                        <div style="font-size: 12px; color: #7dd3fc; margin-bottom: 8px;">Громкость музыки</div>
                        <input type="range" value="60" style="width:100%;">
                    </div>
                </div>
            </div>

            <!-- ГЛАВНЫЙ ЭКРАН -->
            <div class="screen-panel active" id="screen-home">
                <div class="screen-header"><h2>Главная</h2></div>
                <div class="screen-content">
                    <div class="novel-card novel-card-featured">
                        <div class="novel-img-wrapper">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=600&q=80" class="novel-img">
                        </div>
                        <div class="novel-title">СЕРДЦЕ ОКЕАНА</div>
                        <div class="rating-stars">★ ★ ★ ★ ☆</div>
                        <div class="progress-bar-container"><div class="progress-bar-fill" style="width: 45%;"></div></div>
                        <button class="btn-crystal">Читать</button>
                    </div>
                </div>
            </div>

            <!-- ЭКРАН ПРОФИЛЯ -->
            <div class="screen-panel right" id="screen-profile" onclick="switchTab('profile')">
                <div class="screen-header"><h2>Мой Профиль</h2></div>
                <div class="screen-content">
                    <div style="text-align: center; margin: 10px 0;">
                        <div style="width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--cyan-glow); margin: 0 auto; overflow: hidden;">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                        <div style="font-family: 'Cinzel'; font-size: 14px; margin-top: 6px;">Звездный Странник</div>
                        <div style="font-size: 12px; color: #94a3b8;">Уровень 45</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav-container">
            <div class="magic-pedestal">
                <div class="nav-item" id="nav-settings" onclick="switchTab('settings')">
                    <div>⚙️</div>
                    <div style="font-size:10px;">Настройки</div>
                </div>
                <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
                    <div>🌀</div>
                    <div style="font-size:10px;">Главная</div>
                </div>
                <div class="center-dreamcatcher" onclick="switchTab('home')">
                    <div style="font-size:20px; color: var(--cyan-glow);">☸</div>
                    <span>ЛО ВЕЦ<br>СНОВ</span>
                </div>
                <div class="nav-item" onclick="alert('Раздел Магазин')">
                    <div>🪷</div>
                    <div style="font-size:10px;">Магазин</div>
                </div>
                <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
                    <div>👑</div>
                    <div style="font-size:10px;">Профиль</div>
                </div>
            </div>
        </nav>
    </div>

    <script>
        function switchTab(tab) {
            const screenHome = document.getElementById('screen-home');
            const screenSettings = document.getElementById('screen-settings');
            const screenProfile = document.getElementById('screen-profile');

            const navHome = document.getElementById('nav-home');
            const navSettings = document.getElementById('nav-settings');
            const navProfile = document.getElementById('nav-profile');

            [navHome, navSettings, navProfile].forEach(el => el && el.classList.remove('active'));

            if (tab === 'home') {
                screenHome.className = 'screen-panel active';
                screenSettings.className = 'screen-panel left';
                screenProfile.className = 'screen-panel right';
                navHome.classList.add('active');
            } else if (tab === 'settings') {
                screenSettings.className = 'screen-panel active';
                screenHome.className = 'screen-panel right';
                screenProfile.className = 'screen-panel left';
                navSettings.classList.add('active');
            } else if (tab === 'profile') {
                screenProfile.className = 'screen-panel active';
                screenHome.className = 'screen-panel left';
                screenSettings.className = 'screen-panel right';
                navProfile.classList.add('active');
            }
        }
    </script>
</body>
</html>
