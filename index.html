<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Визуальная Новелла</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Звуковое сопровождение (музыка) -->
    <audio id="bg-music" src="audio/main_theme.mp3" loop></audio>
    <audio id="click-sound" src="audio/click.mp3"></audio>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="main-menu" class="screen active">
        <div class="overlay">
            <h1 class="game-title">Название Новеллы</h1>
            <div class="menu-buttons">
                <button id="btn-start" class="menu-btn">Новая игра</button>
                <button id="btn-load" class="menu-btn">Загрузить</button>
                <button id="btn-settings" class="menu-btn">Настройки</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ИГРОВОЙ ПРОЦЕСС -->
    <div id="game-screen" class="screen">
        <!-- Задний фон игры контролируется через JS -->
        <div id="game-bg"></div> 
        
        <!-- Спрайты персонажей -->
        <div class="character-container">
            <img id="char-left" class="sprite" src="" alt="">
            <img id="char-center" class="sprite" src="" alt="">
            <img id="char-right" class="sprite" src="" alt="">
        </div>

        <!-- Окно диалога -->
        <div class="dialogue-box" id="next-step">
            <div id="char-name" class="char-name">Имя</div>
            <div id="dialogue-text" class="dialogue-text">Текст диалога...</div>
            <div class="click-hint">Нажмите для продолжения...</div>
        </div>

        <!-- Окно выбора (появляется при развилках) -->
        <div id="choices-container" class="choices-container hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
