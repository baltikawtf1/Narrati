<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Narrati — Главная</title>
    <link rel="stylesheet" href="assets/css/style.main.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>

    <div class="app-container">
        <!-- Шапка -->
        <header>
            <div class="logo" onclick="showPage('catalog')">Narrati</div>
            <div class="user-stats">
                <div class="stat-badge">
                    <span style="color: var(--diamond-color);">💎</span>
                    <span id="user-diamonds">45</span>
                </div>
            </div>
        </header>

        <!-- 1. КАТАЛОГ ИСТОРИЙ -->
        <div id="page-catalog" class="page active">
            <div class="catalog-content">
                <div class="hero-banner">
                    <div class="hero-title">REMnant</div>
                    <!-- Ведем в папку конкретной новеллы -->
                    <button class="play-btn" onclick="location.href='stories/remnant-1/'">Читать историю</button>
                </div>
                
                <div class="section-title">Все истории</div>
                
                <div class="stories-grid">
                    <div class="story-card" onclick="openStoryModal()">
                        <div class="story-poster">REMnant</div>
                        <div class="story-info">
                            <div class="story-name">REMnant</div>
                            <div style="font-size: 11px; color: var(--text-muted);">Триллер, Сны</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- МОДАЛЬНОЕ ОКНО ИСТОРИИ -->
        <div class="story-modal-overlay" id="storyModal">
            <div class="story-modal-card">
                <button class="close-story-modal" onclick="closeStoryModal()">✕</button>
                <div class="modal-story-poster">REMnant</div>
                <div class="modal-story-title">REMnant</div>
                <div class="modal-story-desc">Грань между снами и реальностью начинает рушиться. Что скрывается в глубинах сознания?</div>
                <button class="modal-play-btn" onclick="location.href='stories/remnant-1/'">Играть</button>
            </div>
        </div>

        <!-- 3. ПРОФИЛЬ -->
        <div id="page-profile" class="page">
            <div class="catalog-content">
                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; text-align: center;">
                    <div style="font-size: 18px; font-weight: 700; margin-bottom: 8px;" id="profile-name">Гость Narrati</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;" id="profile-status">Авторизуйтесь через Telegram</div>
                    <div id="tg-widget-wrap">
                        <script async src="https://telegram.org/js/telegram-widget.js?22" 
                                data-telegram-login="narrati_bot" 
                                data-size="large" 
                                data-radius="12"
                                data-onauth="onTelegramAuth(user)" 
                                data-request-access="write">
                        </script>
                    </div>
                    <button id="logout-btn" style="display:none; background: rgba(239, 68, 68, 0.2); border: 1px solid #EF4444; color: #FCA5A5; padding: 10px; border-radius: 10px; width: 100%; cursor: pointer;" onclick="logout()">Выйти</button>
                </div>
            </div>
        </div>

        <!-- Нижнее меню -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-catalog" onclick="showPage('catalog')">
                <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
                <span>Главная</span>
            </button>
            <button class="nav-item" id="nav-reader" onclick="location.href='stories/remnant-1/'">
                <svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.2 20.4 5.3 20 7 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.85-.75-3-1z"/></svg>
                <span>Читать</span>
            </button>
            <button class="nav-item" id="nav-profile" onclick="showPage('profile')">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>Профиль</span>
            </button>
        </nav>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
